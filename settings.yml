enabled:
  default: true
color_mode:
  default: 'rainbow'
  type: enum
  choices:
    - rainbow
    - solid
  description: 'Choose rainbow for vibrant spectral colors across all dots, or solid to use dot_color.'
backdrop_color:
  default: 'transparent'
  description: 'Background color behind the grid (e.g. transparent, #ffffff, or #08090d).'
dot_color:
  default: '#000000'
  description: 'Color of the square dots when color_mode is solid.'
dot_size:
  default: 1
  min: 1
  max: 10
  description: 'Size of each square dot in pixels.'
grid_gap:
  default: 4
  min: 2
  max: 50
  description: 'Distance between grid dots in pixels.'
min_opacity:
  default: 0.04
  min: 0.0
  max: 1.0
  description: 'Base resting opacity of dots.'
max_opacity:
  default: 0.40
  min: 0.0
  max: 1.0
  description: 'Peak opacity when dots twinkle.'
twinkle_speed:
  default: 0.8
  min: 0.05
  max: 5.0
  description: 'Speed of the fading animation.'
twinkle_density:
  default: 0.25
  min: 0.01
  max: 1.0
  description: 'Portion of dots that actively twinkle at any time.'
rainbow_saturation:
  default: 85
  min: 0
  max: 100
  description: 'Color saturation percentage for rainbow dots.'
rainbow_lightness:
  default: 50
  min: 0
  max: 100
  description: 'Color lightness percentage for rainbow dots (lower for light theme contrast, higher for dark theme).'
